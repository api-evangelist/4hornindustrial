aid: 4hornindustrial
name: 4-Horn Industrial
description: '4-Horn Industrial is an industrial equipment rental, sales and contractor
  supply company headquartered in Nederland, Texas, serving the petrochemical, refinery,
  pipeline and construction markets across the Gulf Coast from branches in Nederland,
  Pasadena and Hutto, Texas and Sulphur, Louisiana. It rents and sells manlifts, air
  compressors, forklifts, compaction and welding equipment, light towers, pneumatic
  tools and general contractor supplies on a 24/7/365 basis. It is an equipment leasing
  and distribution business rather than a software company: it publishes no developer
  program, no public API and no machine-readable API contract. Customer account access
  is delivered through a third-party rental-management portal (Intempo Software) and
  payments through Jack Henry ProfitStars SmartPay, both operated by vendors rather
  than by 4-Horn Industrial itself.'
